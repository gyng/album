name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run prepare:build-manifest
      - run: npm run test:ci
  test-geotag:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tools/geotag
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: tools/geotag/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  test-index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./index
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --dev
      - name: Verify inference dependencies are excluded
        run: uv run python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Run model-free index tests
        run: ./do-test-index.sh
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python formatting
        run: uv run ruff format --check .
  playwright:
    name: Playwright (${{ matrix.browser }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: ./src
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('src/package-lock.json') }}
      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps
      - name: Install Firefox software WebGL
        if: matrix.browser == 'firefox'
        run: sudo apt-get install --yes --no-install-recommends libegl1 libgles2 libgl1-mesa-dri
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: src/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'src/**/*.css', 'src/**/*.js') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('src/package-lock.json') }}-
      - name: Build
        run: npm run build:e2e
      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.browser }}
          path: src/playwright-report/
          retention-days: 30
